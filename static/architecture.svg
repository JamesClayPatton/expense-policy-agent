<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1d2733">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #1f3a5f; stroke-width: 1.5; rx: 8; }
      .code { fill: #f5f7fa; stroke: #d9dfe7; stroke-width: 1.5; rx: 8; }
      .band { fill: #f5f7fa; stroke: #d9dfe7; stroke-width: 1.5; rx: 8; }
      .group { fill: none; stroke: #1f3a5f; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .t { font-weight: 600; font-size: 13px; }
      .s { font-size: 11px; fill: #6b7684; }
      .ln { stroke: #1f3a5f; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .ln2 { stroke: #1f3a5f; stroke-width: 1.5; fill: none; marker-end: url(#a); marker-start: url(#a); }
      .db { stroke: #6b7684; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="960" height="470" fill="#fff"/>

  <!-- LangSmith band -->
  <rect class="band" x="20" y="14" width="920" height="46"/>
  <text class="t" x="34" y="33">LangSmith</text>
  <text class="s" x="34" y="50">every review is one trace: retrieve, each tool call, guard, judge · prompts pulled by commit hash · judge scores posted as feedback · dataset and experiments</text>

  <!-- form -->
  <rect class="box" x="20" y="150" width="120" height="74"/>
  <text class="t" x="80" y="176" text-anchor="middle">Expense form</text>
  <text class="s" x="80" y="193" text-anchor="middle">Flask page</text>
  <text class="s" x="80" y="208" text-anchor="middle">fields + receipt text</text>

  <!-- LangGraph group -->
  <rect class="group" x="166" y="96" width="478" height="222"/>
  <text class="t" x="178" y="116">LangGraph</text>

  <rect class="box" x="186" y="150" width="124" height="74"/>
  <text class="t" x="248" y="176" text-anchor="middle">1  retrieve</text>
  <text class="s" x="248" y="193" text-anchor="middle">8 control sections, always</text>
  <text class="s" x="248" y="208" text-anchor="middle">+ top 4 by similarity</text>

  <rect class="box" x="346" y="150" width="130" height="74"/>
  <text class="t" x="411" y="176" text-anchor="middle">2  agent</text>
  <text class="s" x="411" y="193" text-anchor="middle">gpt-5-mini</text>
  <text class="s" x="411" y="208" text-anchor="middle">must call a tool each turn</text>

  <rect class="code" x="346" y="248" width="130" height="56"/>
  <text class="t" x="411" y="267" text-anchor="middle" font-size="12">tools</text>
  <text class="mono" x="411" y="282" text-anchor="middle">get_employee</text>
  <text class="mono" x="411" y="296" text-anchor="middle">get_budget_remaining · find_duplicates</text>

  <rect class="box" x="512" y="150" width="114" height="74"/>
  <text class="t" x="569" y="176" text-anchor="middle">3  Decision</text>
  <text class="mono" x="569" y="193" text-anchor="middle">approve | flag | reject</text>
  <text class="mono" x="569" y="208" text-anchor="middle">policy_ids, reason</text>

  <!-- guard, record, judge -->
  <rect class="code" x="672" y="150" width="124" height="74"/>
  <text class="t" x="734" y="176" text-anchor="middle">4  guard</text>
  <text class="s" x="734" y="193" text-anchor="middle">deterministic validation</text>
  <text class="s" x="734" y="208" text-anchor="middle">can only make it stricter</text>

  <rect class="box" x="820" y="150" width="120" height="74"/>
  <text class="t" x="880" y="176" text-anchor="middle">5  record</text>
  <text class="s" x="880" y="193" text-anchor="middle">the one write</text>
  <text class="s" x="880" y="208" text-anchor="middle">decision + what it saw</text>

  <rect class="box" x="820" y="262" width="120" height="74"/>
  <text class="t" x="880" y="288" text-anchor="middle">6  judge</text>
  <text class="s" x="880" y="305" text-anchor="middle">claude-sonnet-5-5</text>
  <text class="s" x="880" y="320" text-anchor="middle">grounded · complete · clear · safe</text>

  <!-- flow arrows -->
  <path class="ln" d="M140 187 H184"/>
  <path class="ln" d="M310 187 H344"/>
  <path class="ln2" d="M411 226 V246"/>
  <path class="ln" d="M476 187 H510"/>
  <path class="ln" d="M626 187 H670"/>
  <path class="ln" d="M796 187 H818"/>
  <path class="ln" d="M880 224 V260"/>
  <text class="s" x="560" y="336" text-anchor="middle">the loop ends when the model calls Decision</text>

  <!-- Postgres band -->
  <rect class="band" x="20" y="380" width="920" height="74"/>
  <text class="t" x="34" y="400">Postgres + pgvector</text>
  <text class="s" x="34" y="417">Supabase in this build. Seeded employees, roles, budgets and claim history; the policy as one embedded row per section.</text>
  <text class="mono" x="248" y="442" text-anchor="middle">policy_chunks</text>
  <text class="mono" x="411" y="442" text-anchor="middle">employees · expenses · roles · budgets</text>
  <text class="mono" x="734" y="442" text-anchor="middle">reads the same tables itself</text>
  <text class="mono" x="880" y="442" text-anchor="middle">decisions · judgements</text>
  <path class="db" d="M248 224 V378"/>
  <path class="db" d="M411 304 V378"/>
  <path class="db" d="M734 224 V378"/>
  <path class="db" d="M880 336 V378"/>

  <!-- tracing ties -->
  <path class="db" d="M248 150 V60"/>
  <path class="db" d="M411 150 V60"/>
  <path class="db" d="M734 150 V60"/>
  <path class="db" d="M880 150 V60"/>
</svg>
