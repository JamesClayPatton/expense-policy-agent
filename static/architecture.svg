<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#1d2733">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #1f3a5f; stroke-width: 1.5; rx: 8; }
      .code { fill: #f5f7fa; stroke: #d9dfe7; stroke-width: 1.5; rx: 8; }
      .band { fill: #f5f7fa; stroke: #d9dfe7; stroke-width: 1.5; rx: 8; }
      .group { fill: none; stroke: #1f3a5f; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .t { font-weight: 600; font-size: 13px; }
      .s { font-size: 11px; fill: #6b7684; }
      .ln { stroke: #1f3a5f; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .ln2 { stroke: #1f3a5f; stroke-width: 1.5; fill: none; marker-end: url(#a); marker-start: url(#a); }
      .db { stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="1100" height="480" fill="#fff"/>

  <!-- LangSmith band -->
  <rect class="band" x="20" y="14" width="1060" height="46"/>
  <text class="t" x="34" y="33">LangSmith</text>
  <text class="s" x="34" y="50">every review is one trace: retrieve, each tool call, guard, judge · prompts pulled by commit hash · judge scores posted as feedback · dataset and experiments</text>

  <!-- form -->
  <rect class="box" x="20" y="150" width="130" height="74"/>
  <text class="t" x="85" y="176" text-anchor="middle">Expense form</text>
  <text class="s" x="85" y="193" text-anchor="middle">Flask page</text>
  <text class="s" x="85" y="208" text-anchor="middle">fields + receipt text</text>

  <!-- LangGraph group -->
  <rect class="group" x="170" y="96" width="570" height="236"/>
  <text class="t" x="184" y="116">LangGraph</text>

  <rect class="box" x="190" y="150" width="150" height="74"/>
  <text class="t" x="265" y="176" text-anchor="middle">1  retrieve</text>
  <text class="s" x="265" y="193" text-anchor="middle">8 control sections, always</text>
  <text class="s" x="265" y="208" text-anchor="middle">+ top 4 by similarity</text>

  <rect class="box" x="380" y="150" width="150" height="74"/>
  <text class="t" x="455" y="176" text-anchor="middle">2  agent</text>
  <text class="s" x="455" y="193" text-anchor="middle">gpt-5-mini</text>
  <text class="s" x="455" y="208" text-anchor="middle">must call a tool each turn</text>

  <rect class="code" x="380" y="250" width="150" height="70"/>
  <text class="t" x="455" y="268" text-anchor="middle" font-size="12">tools</text>
  <text class="mono" x="455" y="284" text-anchor="middle">get_employee</text>
  <text class="mono" x="455" y="298" text-anchor="middle">get_budget_remaining</text>
  <text class="mono" x="455" y="312" text-anchor="middle">find_duplicates</text>

  <rect class="box" x="570" y="150" width="150" height="74"/>
  <text class="t" x="645" y="176" text-anchor="middle">3  Decision</text>
  <text class="s" x="645" y="193" text-anchor="middle">approve, flag or reject</text>
  <text class="s" x="645" y="208" text-anchor="middle">policy sections + reason</text>

  <text class="s" x="645" y="300" text-anchor="middle">the loop ends when the</text>
  <text class="s" x="645" y="315" text-anchor="middle">model calls Decision</text>

  <!-- guard, record, judge -->
  <rect class="code" x="760" y="150" width="150" height="74"/>
  <text class="t" x="835" y="176" text-anchor="middle">4  guard</text>
  <text class="s" x="835" y="193" text-anchor="middle">deterministic validation</text>
  <text class="s" x="835" y="208" text-anchor="middle">can only make it stricter</text>

  <rect class="box" x="950" y="150" width="130" height="74"/>
  <text class="t" x="1015" y="176" text-anchor="middle">5  record</text>
  <text class="s" x="1015" y="193" text-anchor="middle">the one write</text>
  <text class="s" x="1015" y="208" text-anchor="middle">decision + what it saw</text>

  <rect class="box" x="950" y="262" width="130" height="74"/>
  <text class="t" x="1015" y="288" text-anchor="middle">6  judge</text>
  <text class="s" x="1015" y="305" text-anchor="middle">claude-sonnet-5-5</text>
  <text class="s" x="1015" y="320" text-anchor="middle">scores the reason 1 to 5</text>

  <!-- flow arrows -->
  <path class="ln" d="M150 187 H188"/>
  <path class="ln" d="M340 187 H378"/>
  <path class="ln2" d="M455 226 V248"/>
  <path class="ln" d="M530 187 H568"/>
  <path class="ln" d="M720 187 H758"/>
  <path class="ln" d="M910 187 H948"/>
  <path class="ln" d="M1015 224 V260"/>

  <!-- Postgres band -->
  <rect class="band" x="20" y="390" width="1060" height="76"/>
  <text class="t" x="34" y="410">Postgres + pgvector</text>
  <text class="s" x="34" y="427">Supabase in this build. Seeded employees, roles, budgets and claim history; the policy as one embedded row per section.</text>
  <text class="mono" x="265" y="452" text-anchor="middle">policy_chunks</text>
  <text class="mono" x="455" y="452" text-anchor="middle">employees · expenses · budgets</text>
  <text class="mono" x="835" y="452" text-anchor="middle">reads the same tables</text>
  <text class="mono" x="1015" y="452" text-anchor="middle">decisions · judgements</text>

  <!-- data ties: box bottom to the band top, off every label -->
  <path class="db" d="M265 224 V388"/>
  <path class="db" d="M455 320 V388"/>
  <path class="db" d="M835 224 V388"/>
  <path class="db" d="M1015 336 V388"/>

  <!-- tracing ties: box top to the band bottom -->
  <path class="db" d="M265 150 V62"/>
  <path class="db" d="M455 150 V62"/>
  <path class="db" d="M835 150 V62"/>
  <path class="db" d="M1015 150 V62"/>
</svg>
